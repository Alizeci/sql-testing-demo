# CPT-SQL benchmark configuration for the e-commerce demo (BenchmarkMain)

# -- Benchmark runner --
# Run label written to the result and report files
loadtest.benchmark.profileName=ecommerce-demo

# Test profile: light | normal | peak | sustained | wave (unknown names fall back to normal)
# Override from CI: --loadtest.benchmark.testProfile=peak
loadtest.benchmark.testProfile=light

# Pause between iterations (ms), used only when a phase's target rate is 0;
# otherwise the pause is 1000 / targetTps ms
loadtest.benchmark.thinkTimeMs=50

# Sampling window for the throughput and latency time series (seconds)
loadtest.benchmark.metricsWindowSecs=10

# -- Mirror database --
# MirrorDatabaseProvisioner starts the Docker container if it is not running.
loadtest.mirror.host=localhost
loadtest.mirror.port=5433
loadtest.mirror.db=mirror
loadtest.mirror.user=mirror
loadtest.mirror.password=mirror
loadtest.mirror.container=cpt-sql-mirror

# Path to the application's DDL script used to create the mirror schema
loadtest.mirror.schema.script=sql-testing-demo/src/main/resources/schema-ecommerce.sql

# -- Mirror data generation (from the differentially private release) --
# Rows generated per mirror table
loadtest.synthetic.rowsPerTable=400000
# Rows per table in the capture database; reported in the fidelity validation (MirrorAccuracy)
loadtest.capture.rowsPerTable=400000
loadtest.synthetic.batchSize=200
loadtest.synthetic.seed=42
loadtest.synthetic.minOrderItemsPerProduct=20

# -- Gate thresholds --
# Minimum % of operations within the SLA for a query verdict to be PASS
loadtest.sla.complianceThresholdPct=95.0

# Tolerance over the baseline p95 (0.50 = BASELINE_EXCEEDED warning if p95 rises >50%,
# and by at least loadtest.detector.baselineMinDeltaMs, default 10 ms). Set high so that
# environment noise does not trigger warnings.
loadtest.detector.baselineTolerancePct=0.50

# Plan cost increase over the baseline tolerated before PLAN_CHANGED (0.20 = 20%)
loadtest.detector.planCostTolerancePct=0.20

# SLA proximity: SLO_PROXIMITY blocks when p95 is above this fraction of the SLA
# (default 0.80), before the SLA itself is violated.
loadtest.detector.sloProximityPct=0.80

# Path to the baseline committed in the repository
loadtest.baseline.path=baseline.json
