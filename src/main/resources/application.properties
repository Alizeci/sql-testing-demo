# =============================================================================
# CPT-SQL — Benchmark Runner (BenchmarkMain)
# =============================================================================

# ── Benchmark runner ──────────────────────────────────────────────────────────
# Load profile name (appears in generated JSON artifacts)
loadtest.benchmark.profileName=ecommerce-demo

# Execution profile: light | normal | peak | sustained | wave
# Override from CI: --loadtest.benchmark.testProfile=peak
loadtest.benchmark.testProfile=light

# Think time between transactions (ms)
loadtest.benchmark.thinkTimeMs=50

# Sampling window for time series (seconds)
loadtest.benchmark.metricsWindowSecs=10

# ── Mirror DB ─────────────────────────────────────────────────────────────────
# MirrorDatabaseProvisioner starts the Docker container automatically
# if it is not running. No manual Docker configuration is required.
loadtest.mirror.host=localhost
loadtest.mirror.port=5433
loadtest.mirror.db=mirror
loadtest.mirror.user=mirror
loadtest.mirror.password=mirror
loadtest.mirror.container=cpt-sql-mirror

# Path to the user's DDL script — the only input required by CPT-SQL
loadtest.mirror.schema.script=sql-testing-demo/src/main/resources/schema-ecommerce.sql

# ── Synthetic data (SynQB — DPSDG) — environment: pc-local-runner, PG tuned ────
loadtest.synthetic.rowsPerTable=400000
# Rows per table populated in the dev database (matches the mirror light volume, used by the MirrorAccuracy report)
loadtest.capture.rowsPerTable=400000
loadtest.synthetic.batchSize=200
loadtest.synthetic.seed=42
loadtest.synthetic.minOrderItemsPerProduct=20

# ── Validation thresholds ────────────────────────────────────────────────────
# Minimum % of operations within the SLA to consider PASS
loadtest.sla.complianceThresholdPct=95.0

# Degradation tolerance over the baseline (50% = BASELINE_EXCEEDED if p95 rises >50%)
# High value to avoid noise from small environment variations.
# Only warn when the degradation versus history is significant.
loadtest.detector.baselineTolerancePct=0.50

# Execution plan change tolerance (20% cost increase)
loadtest.detector.planCostTolerancePct=0.20

# SLA proximity threshold — blocks if p95 exceeds this % of the SLA (80% by default)
# Prevents merges in the risk zone before the SLA is formally violated.
loadtest.detector.sloProximityPct=0.80

# Path to the baseline committed in the repository
loadtest.baseline.path=baseline.json
