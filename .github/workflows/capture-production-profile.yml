name: Capture — Production load profile

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      simulation-secs:
        description: 'Simulation duration in seconds (default: 180)'
        required: false
        default: '180'

jobs:
  call-cpt-capture-profile:
    uses: Alizeci/CPT-SQL/.github/workflows/capture-production-profile.yml@main
    with:
      simulation-secs: ${{ fromJson(inputs.simulation-secs || '180') }}
    secrets:
      DB_URL: ${{ secrets.DEMO_DB_URL }}
      DB_USER: ${{ secrets.DEMO_DB_USER }}
      DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
