name: Capture — Production load profile

# The load profile and the PR baseline are versioned as a pair: every completed
# capture triggers "Baseline — Update post-merge" (workflow_run), so the baseline
# is always measured against the current load profile.
#
# Capture is manual by default. A daily profile adds noise to plan-cost
# comparisons; a weekly cadence is recommended in steady state (uncomment below).
on:
  # schedule:
  #   - cron: '0 2 * * 1'   # weekly, Mondays 02:00 UTC
  workflow_dispatch:
    inputs:
      simulation-secs:
        description: 'Simulation duration in seconds (default: 600)'
        required: false
        default: '600'

jobs:
  call-cpt-capture-profile:
    uses: Alizeci/CPT-SQL/.github/workflows/capture-production-profile.yml@v1.0.0
    with:
      simulation-secs: ${{ fromJson(inputs.simulation-secs || '600') }}
      # Declared from domain knowledge (catalogue rules), never from captured data.
      dp-bounds: 'price:1:600,stock_quantity:0:600,rating:0:5,unit_price:1:600,quantity:1:10,total_amount:1:1100'
      # Low-cardinality business columns, declared explicitly (never inferred from data).
      dp-categorical: 'products.category,orders.status,customers.tier,inventory_log.reason'
    secrets:
      DB_URL: ${{ secrets.DEMO_DB_URL }}
      DB_USER: ${{ secrets.DEMO_DB_USER }}
      DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
