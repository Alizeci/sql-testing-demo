name: Light Benchmark — PR Degradation Gate

on:
  pull_request:
    branches: [main, develop, qa]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: light-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  call-cpt-light-benchmark:
    uses: Alizeci/CPT-SQL/.github/workflows/light-benchmark.yml@v1.0.0
    with:
      schema-script: src/main/resources/schema-ecommerce.sql
      jar-path: build/libs/sql-testing-demo.jar
      rows-per-table: 400000
    secrets:
      DB_URL: ${{ secrets.DEMO_DB_URL }}
      DB_USER: ${{ secrets.DEMO_DB_USER }}
      DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
